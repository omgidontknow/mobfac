<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1,
           maximum-scale=1,
           user-scalable=no"
>

<title>Sand-works</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #82cef4;

  touch-action: none;

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

#game {
  display: block;

  width: 100vw;
  height: 100vh;

  image-rendering: pixelated;
}

/* =========================================================
   TOP UI
========================================================= */

#ui {
  position: fixed;

  top: 10px;
  left: 10px;
  right: 10px;

  display: flex;

  justify-content: space-between;
  align-items: flex-start;

  pointer-events: none;

  z-index: 10;
}

.panel {
  background:
    rgba(25, 29, 32, .82);

  color: white;

  border:
    1px solid
    rgba(255,255,255,.22);

  border-radius: 11px;

  padding:
    8px 12px;

  font-size: 14px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.15);

  backdrop-filter:
    blur(5px);
}


/* =========================================================
   ACTION BAR
========================================================= */

#actions {
  position: fixed;

  left: 50%;
  bottom: 20px;

  transform: translateX(-50%);

  display: flex;

  gap: 7px;

  padding: 7px;

  background:
    rgba(25, 29, 32, .86);

  border:
    1px solid
    rgba(255,255,255,.2);

  border-radius: 15px;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,.25);

  backdrop-filter:
    blur(7px);

  z-index: 20;
}


.action {
  border: 0;

  min-width: 62px;
  height: 54px;

  border-radius: 11px;

  background:
    rgba(255,255,255,.09);

  color:
    rgba(255,255,255,.82);

  font-size: 12px;

  font-weight: 600;

  cursor: pointer;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  gap: 2px;

  touch-action: manipulation;

  transition:
    background .12s,
    transform .12s,
    color .12s;
}


.action .icon {
  font-size: 21px;

  line-height: 21px;
}


.action:active {
  transform:
    scale(.94);
}


.action.selected {
  background:
    #e2ad3d;

  color:
    #27200f;

  box-shadow:
    0 0 0 2px
    rgba(255,215,105,.28),
    0 3px 10px
    rgba(0,0,0,.25);
}


/* =========================================================
   HINT
========================================================= */

#hint {
  position: fixed;

  left: 50%;

  bottom: 86px;

  transform:
    translateX(-50%);

  background:
    rgba(25,29,32,.75);

  color:
    rgba(255,255,255,.9);

  padding:
    6px 10px;

  border-radius:
    8px;

  font-size:
    11px;

  white-space:
    nowrap;

  pointer-events:
    none;

  z-index:
    10;

  opacity:
    .9;
}


/* =========================================================
   VERSION
========================================================= */

#version {
  position: fixed;

  right: 7px;
  bottom: 5px;

  color:
    rgba(255,255,255,.38);

  font-size:
    9px;

  font-family:
    monospace;

  pointer-events:
    none;

  user-select:
    none;

  z-index:
    30;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 430px) {

  #actions {
    bottom: 15px;

    gap: 5px;

    padding: 6px;
  }

  .action {
    min-width: 59px;
    height: 52px;
  }

  #hint {
    bottom: 79px;
  }
}

</style>
</head>


<body>

<canvas id="game"></canvas>


<!-- =======================================================
     TOP UI
======================================================= -->

<div id="ui">

  <div class="panel">
    SANDWORKS
  </div>

  <div
    id="inventory"
    class="panel"
  >
    Inventory: Empty
  </div>

</div>


<!-- =======================================================
     ACTION BAR
======================================================= -->

<div id="actions">

  <button
    class="action selected"
    data-mode="mine"
    type="button"
  >
    <span class="icon">⛏</span>
    <span>Mine</span>
  </button>


  <button
    class="action"
    data-mode="collect"
    type="button"
  >
    <span class="icon">✋</span>
    <span>Collect</span>
  </button>


  <button
    class="action"
    data-mode="drop"
    type="button"
  >
    <span class="icon">▼</span>
    <span>Drop</span>
  </button>


  <button
    class="action"
    data-mode="pan"
    type="button"
  >
    <span class="icon">✥</span>
    <span>Pan</span>
  </button>

</div>


<div id="hint">
  Mine exposed ground
</div>


<div id="version">
  v0.2.0
</div>


<script>

"use strict";


/* =========================================================
   CONFIGURATION
========================================================= */

const VERSION = "v0.2.0";

const CELL = 12;

const WORLD_WIDTH = 140;

const WORLD_HEIGHT = 200;

const DIRT_TO_SAND = 2;

const MINING_RADIUS = 2.25;

const MAX_SAND_PARTICLES = 7000;

const INVENTORY_CAPACITY = 25;


/* =========================================================
   CANVAS
========================================================= */

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;

let screenW = 0;
let screenH = 0;


function resize() {

  screenW =
    canvas.width =
      window.innerWidth;

  screenH =
    canvas.height =
      window.innerHeight;
}


window.addEventListener(
  "resize",
  resize
);

resize();


/* =========================================================
   MATERIALS
========================================================= */

const AIR = 0;

const DIRT = 1;

const STONE = 2;

const BEDROCK = 3;


/* =========================================================
   WORLD
========================================================= */

const terrain =
  new Uint8Array(
    WORLD_WIDTH *
    WORLD_HEIGHT
  );

const grass =
  new Uint8Array(
    WORLD_WIDTH *
    WORLD_HEIGHT
  );


function index(x, y) {

  return (
    y *
    WORLD_WIDTH +
    x
  );
}


function insideWorld(x, y) {

  return (
    x >= 0 &&
    x < WORLD_WIDTH &&
    y >= 0 &&
    y < WORLD_HEIGHT
  );
}


function getTerrain(x, y) {

  if (
    !insideWorld(x, y)
  ) {

    return BEDROCK;
  }

  return terrain[
    index(x, y)
  ];
}


function setTerrain(
  x,
  y,
  material
) {

  if (
    !insideWorld(x, y)
  ) {
    return;
  }

  terrain[
    index(x, y)
  ] = material;
}


/* =========================================================
   NATURAL SURFACE
========================================================= */

const surfaceHeights =
  new Int16Array(
    WORLD_WIDTH
  );


for (
  let x = 0;
  x < WORLD_WIDTH;
  x++
) {

  const large =
    Math.sin(
      x * .055
    ) * 3.5;

  const medium =
    Math.sin(
      x * .13
    ) * 1.5;

  const small =
    Math.sin(
      x * .37
    ) * .45;

  const irregular =
    Math.sin(
      x * 1.17
    ) * .18;

  surfaceHeights[x] =
    Math.round(
      22 +
      large +
      medium +
      small +
      irregular
    );
}


/* =========================================================
   GENERATE TERRAIN
========================================================= */

for (
  let x = 0;
  x < WORLD_WIDTH;
  x++
) {

  const surface =
    surfaceHeights[x];


  for (
    let y = 0;
    y < WORLD_HEIGHT;
    y++
  ) {

    if (
      y < surface
    ) {

      setTerrain(
        x,
        y,
        AIR
      );

    } else if (
      y < surface + 22
    ) {

      setTerrain(
        x,
        y,
        DIRT
      );

    } else if (
      y <
      WORLD_HEIGHT - 7
    ) {

      setTerrain(
        x,
        y,
        STONE
      );

    } else {

      setTerrain(
        x,
        y,
        BEDROCK
      );
    }
  }


  if (
    getTerrain(
      x,
      surface
    ) === DIRT
  ) {

    grass[
      index(x, surface)
    ] = 1;
  }
}


/* =========================================================
   SAND PARTICLES
========================================================= */

const sandParticles = [];


function spawnSand(
  x,
  y,
  amount = 14
) {

  for (
    let i = 0;
    i < amount;
    i++
  ) {

    if (
      sandParticles.length >=
      MAX_SAND_PARTICLES
    ) {

      return;
    }


    sandParticles.push({

      x:
        x * CELL +
        CELL / 2 +
        (Math.random() - .5) * 5,

      y:
        y * CELL +
        CELL * .45 +
        (Math.random() - .5) * 4,

      vx:
        (Math.random() - .5) * .4,

      vy:
        Math.random() * .7,

      size:
        .75 +
        Math.random() * .8,

      colour:
        Math.random() < .5
          ? "#dfb84e"
          : "#efd06a"
    });
  }
}


/* =========================================================
   SAND COLLISION
========================================================= */

function sandBlocked(
  x,
  y
) {

  const wx =
    Math.floor(
      x / CELL
    );

  const wy =
    Math.floor(
      y / CELL
    );


  if (
    !insideWorld(
      wx,
      wy
    )
  ) {

    return true;
  }


  return (
    getTerrain(
      wx,
      wy
    ) !== AIR
  );
}


function canSandMove(
  p,
  x,
  y
) {

  const r =
    p.size;


  return !(
    sandBlocked(
      x - r,
      y + r
    ) ||

    sandBlocked(
      x,
      y + r
    ) ||

    sandBlocked(
      x + r,
      y + r
    )
  );
}


/* =========================================================
   SAND PHYSICS
========================================================= */

function updateSand() {

  sandParticles.sort(
    (a, b) =>
      b.y - a.y
  );


  for (
    const p of sandParticles
  ) {

    p.vy += .17;

    p.vy =
      Math.min(
        p.vy,
        4.5
      );

    p.vx *= .965;


    const nextX =
      p.x + p.vx;

    const nextY =
      p.y + p.vy;


    if (
      canSandMove(
        p,
        nextX,
        nextY
      )
    ) {

      p.x =
        nextX;

      p.y =
        nextY;

      continue;
    }


    p.vy *= -.08;


    const slide =
      .45 +
      Math.random() * .45;


    const left =
      canSandMove(
        p,
        p.x - slide,
        p.y + 1
      );


    const right =
      canSandMove(
        p,
        p.x + slide,
        p.y + 1
      );


    if (
      left &&
      right
    ) {

      if (
        Math.random() < .5
      ) {

        p.x -= slide;

      } else {

        p.x += slide;
      }

    } else if (left) {

      p.x -= slide;

    } else if (right) {

      p.x += slide;

    } else {

      p.vx = 0;
      p.vy = 0;
    }


    p.x =
      Math.max(
        1,
        Math.min(
          WORLD_WIDTH * CELL - 1,
          p.x
        )
      );
  }
}


/* =========================================================
   INVENTORY
========================================================= */

const inventory = {

  type: null,

  amount: 0,

  capacity:
    INVENTORY_CAPACITY
};


function updateInventoryUI() {

  const element =
    document.getElementById(
      "inventory"
    );


  if (
    !inventory.type
  ) {

    element.textContent =
      "Inventory: Empty";

    return;
  }


  element.textContent =
    "Holding: " +
    inventory.type +
    " × " +
    inventory.amount +
    "/" +
    inventory.capacity;
}


/* =========================================================
   ACTION MODES
========================================================= */

let currentMode =
  "mine";


const hints = {

  mine:
    "Mine exposed ground",

  collect:
    "Collect loose sand",

  drop:
    "Drop held material",

  pan:
    "Drag to move around the map"
};


const actionButtons =
  document.querySelectorAll(
    ".action"
  );


actionButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      event => {

        event.preventDefault();

        setMode(
          button.dataset.mode
        );
      }
    );
  }
);


function setMode(
  mode
) {

  currentMode =
    mode;


  actionButtons.forEach(
    button => {

      button.classList.toggle(
        "selected",
        button.dataset.mode === mode
      );
    }
  );


  document.getElementById(
    "hint"
  ).textContent =
    hints[mode];
}


/* =========================================================
   MINING
========================================================= */

let dirtConversion = 0;


function isExposed(
  x,
  y
) {

  if (
    !insideWorld(
      x,
      y
    )
  ) {

    return false;
  }


  return (

    getTerrain(
      x + 1,
      y
    ) === AIR ||

    getTerrain(
      x - 1,
      y
    ) === AIR ||

    getTerrain(
      x,
      y + 1
    ) === AIR ||

    getTerrain(
      x,
      y - 1
    ) === AIR
  );
}


function mineCircular(
  centerX,
  centerY
) {

  const radius =
    MINING_RADIUS;


  const minX =
    Math.floor(
      centerX -
      radius
    );

  const maxX =
    Math.ceil(
      centerX +
      radius
    );

  const minY =
    Math.floor(
      centerY -
      radius
    );

  const maxY =
    Math.ceil(
      centerY +
      radius
    );


  for (
    let y = minY;
    y <= maxY;
    y++
  ) {

    for (
      let x = minX;
      x <= maxX;
      x++
    ) {

      if (
        !insideWorld(
          x,
          y
        )
      ) {
        continue;
      }


      const dx =
        x -
        centerX;

      const dy =
        y -
        centerY;


      if (
        dx * dx +
        dy * dy >
        radius * radius
      ) {

        continue;
      }


      mineBlock(
        x,
        y
      );
    }
  }


  refreshGrass();
}


function mineBlock(
  x,
  y
) {

  const material =
    getTerrain(
      x,
      y
    );


  if (
    material === AIR
  ) {
    return;
  }


  if (
    !isExposed(
      x,
      y
    )
  ) {
    return;
  }


  if (
    material === DIRT
  ) {

    setTerrain(
      x,
      y,
      AIR
    );


    grass[
      index(x, y)
    ] = 0;


    dirtConversion++;


    if (
      dirtConversion >=
      DIRT_TO_SAND
    ) {

      dirtConversion -=
        DIRT_TO_SAND;


      spawnSand(
        x,
        y,
        16
      );
    }


    return;
  }


  if (
    material === STONE
  ) {

    setTerrain(
      x,
      y,
      AIR
    );


    grass[
      index(x, y)
    ] = 0;


    spawnStoneDust(
      x,
      y
    );
  }
}


/* =========================================================
   GRASS
========================================================= */

function refreshGrass() {

  grass.fill(0);


  for (
    let x = 0;
    x < WORLD_WIDTH;
    x++
  ) {

    for (
      let y = 0;
      y < WORLD_HEIGHT;
      y++
    ) {

      if (
        getTerrain(
          x,
          y
        ) !== DIRT
      ) {

        continue;
      }


      if (
        getTerrain(
          x,
          y - 1
        ) === AIR
      ) {

        grass[
          index(x, y)
        ] = 1;

        break;
      }
    }
  }
}


/* =========================================================
   STONE DUST
========================================================= */

const stoneDust = [];


function spawnStoneDust(
  x,
  y
) {

  for (
    let i = 0;
    i < 6;
    i++
  ) {

    stoneDust.push({

      x:
        x * CELL +
        CELL / 2 +
        (Math.random() - .5) * 8,

      y:
        y * CELL +
        CELL / 2 +
        (Math.random() - .5) * 8,

      vx:
        (Math.random() - .5) *
        .9,

      vy:
        -Math.random() *
        .9,

      life:
        20 +
        Math.random() * 20
    });
  }
}


function updateStoneDust() {

  for (
    let i =
      stoneDust.length - 1;

    i >= 0;

    i--
  ) {

    const p =
      stoneDust[i];


    p.x +=
      p.vx;

    p.y +=
      p.vy;

    p.vy +=
      .04;

    p.life--;


    if (
      p.life <= 0
    ) {

      stoneDust.splice(
        i,
        1
      );
    }
  }
}


/* =========================================================
   COLLECT SAND
========================================================= */

function collectSand(
  worldX,
  worldY
) {

  if (
    inventory.type &&
    inventory.type !== "sand"
  ) {

    return false;
  }


  if (
    inventory.amount >=
    inventory.capacity
  ) {

    return false;
  }


  const targetX =
    worldX * CELL +
    CELL / 2;

  const targetY =
    worldY * CELL +
    CELL / 2;


  let closest =
    -1;

  let closestDistance =
    Infinity;


  for (
    let i = 0;
    i < sandParticles.length;
    i++
  ) {

    const p =
      sandParticles[i];


    const dx =
      p.x -
      targetX;

    const dy =
      p.y -
      targetY;


    const distance =
      dx * dx +
      dy * dy;


    if (
      distance <
      closestDistance
    ) {

      closestDistance =
        distance;

      closest =
        i;
    }
  }


  if (
    closest === -1 ||
    closestDistance >
      10 * 10
  ) {

    return false;
  }


  sandParticles.splice(
    closest,
    1
  );


  inventory.type =
    "sand";

  inventory.amount++;


  updateInventoryUI();


  return true;
}


/* =========================================================
   DROP SAND
========================================================= */

function dropSand(
  worldX,
  worldY
) {

  if (
    inventory.type !== "sand"
  ) {

    return false;
  }


  if (
    inventory.amount <= 0
  ) {

    return false;
  }


  spawnSand(
    worldX,
    worldY,
    10
  );


  inventory.amount--;


  if (
    inventory.amount <= 0
  ) {

    inventory.type = null;

    inventory.amount = 0;
  }


  updateInventoryUI();


  return true;
}


/* =========================================================
   CAMERA
========================================================= */

let cameraX = 0;

let cameraY = 0;

let zoom = 1;


function clampCamera() {

  const worldW =
    WORLD_WIDTH *
    CELL;

  const worldH =
    WORLD_HEIGHT *
    CELL;


  const visibleW =
    screenW /
    zoom;

  const visibleH =
    screenH /
    zoom;


  cameraX =
    Math.max(
      0,
      Math.min(
        cameraX,
        Math.max(
          0,
          worldW -
          visibleW
        )
      )
    );


  cameraY =
    Math.max(
      0,
      Math.min(
        cameraY,
        Math.max(
          0,
          worldH -
          visibleH
        )
      )
    );
}


function screenToWorld(
  screenX,
  screenY
) {

  return {

    x:
      Math.floor(
        (
          cameraX +
          screenX / zoom
        ) / CELL
      ),

    y:
      Math.floor(
        (
          cameraY +
          screenY / zoom
        ) / CELL
      )
  };
}


/* =========================================================
   POINTER INPUT
========================================================= */

let pointerDown =
  false;

let dragging =
  false;

let lastPointerX =
  0;

let lastPointerY =
  0;


canvas.addEventListener(
  "pointerdown",
  e => {

    pointerDown =
      true;

    dragging =
      false;


    lastPointerX =
      e.clientX;

    lastPointerY =
      e.clientY;


    canvas.setPointerCapture(
      e.pointerId
    );
  }
);


canvas.addEventListener(
  "pointermove",
  e => {

    if (
      !pointerDown
    ) {

      return;
    }


    const dx =
      e.clientX -
      lastPointerX;

    const dy =
      e.clientY -
      lastPointerY;


    if (
      Math.abs(dx) > 3 ||
      Math.abs(dy) > 3
    ) {

      dragging =
        true;
    }


    /*
      Only Pan mode moves the camera.

      This means accidental finger movement while
      mining/collecting won't drag the world.
    */

    if (
      currentMode === "pan" &&
      dragging
    ) {

      cameraX -=
        dx / zoom;

      cameraY -=
        dy / zoom;


      clampCamera();
    }


    lastPointerX =
      e.clientX;

    lastPointerY =
      e.clientY;
  }
);


canvas.addEventListener(
  "pointerup",
  e => {

    /*
      Pan mode uses dragging.

      Other modes use taps.
    */

    if (
      currentMode !== "pan" &&
      !dragging
    ) {

      handleActionTap(
        e.clientX,
        e.clientY
      );
    }


    pointerDown =
      false;

    dragging =
      false;
  }
);


/* =========================================================
   ACTION TAP
========================================================= */

function handleActionTap(
  screenX,
  screenY
) {

  const pos =
    screenToWorld(
      screenX,
      screenY
    );


  switch (
    currentMode
  ) {

    case "mine":

      mineCircular(
        pos.x,
        pos.y
      );

      break;


    case "collect":

      collectSand(
        pos.x,
        pos.y
      );

      break;


    case "drop":

      dropSand(
        pos.x,
        pos.y
      );

      break;
  }
}


/* =========================================================
   PINCH ZOOM
========================================================= */

let pinchStart =
  null;

let pinchZoom =
  1;


canvas.addEventListener(
  "touchstart",
  e => {

    if (
      e.touches.length === 2
    ) {

      pinchStart =
        distance(
          e.touches[0],
          e.touches[1]
        );

      pinchZoom =
        zoom;
    }
  },
  {
    passive: false
  }
);


canvas.addEventListener(
  "touchmove",
  e => {

    if (
      e.touches.length === 2
    ) {

      e.preventDefault();


      const current =
        distance(
          e.touches[0],
          e.touches[1]
        );


      if (
        pinchStart
      ) {

        zoom =
          pinchZoom *
          (
            current /
            pinchStart
          );


        zoom =
          Math.max(
            .7,
            Math.min(
              3,
              zoom
            )
          );


        clampCamera();
      }
    }
  },
  {
    passive: false
  }
);


function distance(
  a,
  b
) {

  const dx =
    a.clientX -
    b.clientX;

  const dy =
    a.clientY -
    b.clientY;


  return Math.sqrt(
    dx * dx +
    dy * dy
  );
}


/* =========================================================
   RENDER
========================================================= */

function render() {

  const sky =
    ctx.createLinearGradient(
      0,
      0,
      0,
      screenH
    );


  sky.addColorStop(
    0,
    "#65b8e9"
  );

  sky.addColorStop(
    .7,
    "#a5daf3"
  );

  sky.addColorStop(
    1,
    "#cceaf5"
  );


  ctx.fillStyle =
    sky;


  ctx.fillRect(
    0,
    0,
    screenW,
    screenH
  );


  ctx.save();


  ctx.scale(
    zoom,
    zoom
  );


  ctx.translate(
    -cameraX,
    -cameraY
  );


  const startX =
    Math.max(
      0,
      Math.floor(
        cameraX /
        CELL
      )
    );


  const startY =
    Math.max(
      0,
      Math.floor(
        cameraY /
        CELL
      )
    );


  const endX =
    Math.min(
      WORLD_WIDTH,
      Math.ceil(
        (
          cameraX +
          screenW / zoom
        ) / CELL
      )
    );


  const endY =
    Math.min(
      WORLD_HEIGHT,
      Math.ceil(
        (
          cameraY +
          screenH / zoom
        ) / CELL
      )
    );


  /* =======================================================
     TERRAIN
  ======================================================= */

  for (
    let y = startY;
    y < endY;
    y++
  ) {

    for (
      let x = startX;
      x < endX;
      x++
    ) {

      const material =
        getTerrain(
          x,
          y
        );


      if (
        material === AIR
      ) {

        continue;
      }


      const px =
        x * CELL;

      const py =
        y * CELL;


      if (
        material === DIRT
      ) {

        ctx.fillStyle =
          "#986640";


        ctx.fillRect(
          px,
          py,
          CELL,
          CELL
        );


        const seed =
          (
            x * 928371 +
            y * 523123
          ) & 255;


        if (
          seed % 7 === 0
        ) {

          ctx.fillStyle =
            "#875a38";


          ctx.fillRect(
            px + 2,
            py + 5,
            2,
            2
          );
        }


        if (
          seed % 11 === 0
        ) {

          ctx.fillStyle =
            "#ae774a";


          ctx.fillRect(
            px + 7,
            py + 3,
            2,
            2
          );
        }


        if (
          seed % 19 === 0
        ) {

          ctx.fillStyle =
            "#7f5435";


          ctx.fillRect(
            px + 5,
            py + 9,
            2,
            1
          );
        }


        if (
          grass[
            index(x, y)
          ]
        ) {

          ctx.fillStyle =
            "#57943b";


          ctx.fillRect(
            px,
            py,
            CELL,
            3
          );


          if (
            seed % 3 === 0
          ) {

            ctx.fillStyle =
              "#6baa46";


            ctx.fillRect(
              px + 2,
              py,
              2,
              2
            );
          }


          if (
            seed % 5 === 0
          ) {

            ctx.fillStyle =
              "#467f32";


            ctx.fillRect(
              px + 8,
              py + 1,
              2,
              2
            );
          }
        }

      } else if (
        material === STONE
      ) {

        ctx.fillStyle =
          "#686d72";


        ctx.fillRect(
          px,
          py,
          CELL,
          CELL
        );


        const seed =
          (
            x * 38171 +
            y * 71993
          ) & 255;


        if (
          seed % 5 === 0
        ) {

          ctx.fillStyle =
            "#575c61";


          ctx.fillRect(
            px + 2,
            py + 3,
            3,
            2
          );
        }


        if (
          seed % 8 === 0
        ) {

          ctx.fillStyle =
            "#7b8084";


          ctx.fillRect(
            px + 7,
            py + 7,
            2,
            2
          );
        }


        if (
          seed % 13 === 0
        ) {

          ctx.fillStyle =
            "#5e6368";


          ctx.fillRect(
            px + 4,
            py + 9,
            2,
            1
          );
        }

      } else if (
        material === BEDROCK
      ) {

        ctx.fillStyle =
          "#282b2f";


        ctx.fillRect(
          px,
          py,
          CELL,
          CELL
        );


        const seed =
          (
            x * 217 +
            y * 731
          ) & 255;


        if (
          seed % 7 === 0
        ) {

          ctx.fillStyle =
            "#35393d";


          ctx.fillRect(
            px + 3,
            py + 3,
            2,
            2
          );
        }
      }
    }
  }


  /* =======================================================
     SAND
  ======================================================= */

  for (
    const p of sandParticles
  ) {

    if (
      p.x <
        cameraX - 10 ||

      p.x >
        cameraX +
        screenW / zoom +
        10 ||

      p.y <
        cameraY - 10 ||

      p.y >
        cameraY +
        screenH / zoom +
        10
    ) {

      continue;
    }


    ctx.fillStyle =
      p.colour;


    ctx.beginPath();


    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI * 2
    );


    ctx.fill();
  }


  /* =======================================================
     STONE DUST
  ======================================================= */

  for (
    const p of stoneDust
  ) {

    ctx.fillStyle =
      `rgba(
        210,
        210,
        210,
        ${p.life / 40}
      )`;


    ctx.fillRect(
      p.x,
      p.y,
      2,
      2
    );
  }


  ctx.restore();
}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop() {

  updateSand();

  updateSand();

  updateStoneDust();

  render();

  requestAnimationFrame(
    gameLoop
  );
}


/* =========================================================
   START
========================================================= */

updateInventoryUI();

setMode("mine");

requestAnimationFrame(
  gameLoop
);

</script>
