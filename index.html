<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Sandworks</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #82cef4;
  touch-action: none;
  font-family: system-ui, sans-serif;
}

#game {
  display: block;
  width: 100vw;
  height: 100vh;
  image-rendering: pixelated;
}

#ui {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
}

.panel {
  background: rgba(25, 29, 32, .82);
  color: white;
  border: 1px solid rgba(255,255,255,.22);
  border-radius: 11px;
  padding: 8px 12px;
  font-size: 14px;
  box-shadow: 0 3px 12px rgba(0,0,0,.15);
}

#hint {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(25,29,32,.82);
  color: white;
  padding: 8px 12px;
  border-radius: 10px;
  font-size: 12px;
  white-space: nowrap;
  pointer-events: none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
  <div class="panel">SANDWORKS</div>
  <div id="inventory" class="panel">Inventory: Empty</div>
</div>

<div id="hint">
  Tap ground to mine • Tap sand to collect • Tap again to drop
</div>

<script>
"use strict";

/* =========================================================
   CONFIGURATION
========================================================= */

const CELL = 12;

const WORLD_WIDTH = 120;
const WORLD_HEIGHT = 180;

const DIRT_TO_SAND = 2;

/*
  Circular mining radius in cells.
*/
const MINING_RADIUS = 2.0;


/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;

let screenW = 0;
let screenH = 0;

function resize() {
  screenW = canvas.width = window.innerWidth;
  screenH = canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();


/* =========================================================
   MATERIALS
========================================================= */

const AIR = 0;
const DIRT = 1;
const STONE = 2;
const BEDROCK = 3;


/* =========================================================
   WORLD ARRAYS
========================================================= */

const terrain =
  new Uint8Array(WORLD_WIDTH * WORLD_HEIGHT);

/*
  Grass is separate from dirt, but only exists on
  the currently exposed surface.

  This means it disappears naturally when that
  surface cell is mined.
*/
const grass =
  new Uint8Array(WORLD_WIDTH * WORLD_HEIGHT);

const sand =
  new Uint8Array(WORLD_WIDTH * WORLD_HEIGHT);


function index(x, y) {
  return y * WORLD_WIDTH + x;
}

function insideWorld(x, y) {
  return (
    x >= 0 &&
    x < WORLD_WIDTH &&
    y >= 0 &&
    y < WORLD_HEIGHT
  );
}

function getTerrain(x, y) {
  if (!insideWorld(x, y)) return BEDROCK;
  return terrain[index(x, y)];
}

function setTerrain(x, y, material) {
  if (!insideWorld(x, y)) return;

  terrain[index(x, y)] = material;
}


/* =========================================================
   NATURAL SURFACE
========================================================= */

/*
  Generate a gently varying surface.

  Several sine waves are combined so the ground isn't
  perfectly repetitive.
*/

const surfaceHeights = new Int16Array(WORLD_WIDTH);

for (let x = 0; x < WORLD_WIDTH; x++) {

  const variation =
    Math.sin(x * 0.12) * 2 +
    Math.sin(x * 0.037) * 3 +
    Math.sin(x * 0.29) * 0.7;

  surfaceHeights[x] =
    Math.round(21 + variation);
}


/* =========================================================
   GENERATE TERRAIN
========================================================= */

for (let x = 0; x < WORLD_WIDTH; x++) {

  const surface = surfaceHeights[x];

  for (let y = 0; y < WORLD_HEIGHT; y++) {

    if (y < surface) {

      setTerrain(x, y, AIR);

    } else if (y < surface + 22) {

      setTerrain(x, y, DIRT);

    } else if (y < WORLD_HEIGHT - 6) {

      setTerrain(x, y, STONE);

    } else {

      setTerrain(x, y, BEDROCK);
    }
  }

  /*
    Only the top dirt block receives grass.
  */

  if (getTerrain(x, surface) === DIRT) {
    grass[index(x, surface)] = 1;
  }
}


/* =========================================================
   SAND
========================================================= */

function hasSand(x, y) {

  if (!insideWorld(x, y)) return false;

  return sand[index(x, y)] !== 0;
}

function addSand(x, y) {

  if (!insideWorld(x, y)) return false;

  const i = index(x, y);

  if (terrain[i] !== AIR) return false;
  if (sand[i]) return false;

  sand[i] = 1;

  return true;
}

function removeSand(x, y) {

  if (!insideWorld(x, y)) return false;

  const i = index(x, y);

  if (!sand[i]) return false;

  sand[i] = 0;

  return true;
}


/* =========================================================
   SAND PHYSICS
========================================================= */

function moveSand(x1, y1, x2, y2) {

  if (!insideWorld(x2, y2)) return false;

  const from = index(x1, y1);
  const to = index(x2, y2);

  if (!sand[from]) return false;

  if (terrain[to] !== AIR) return false;
  if (sand[to]) return false;

  sand[to] = 1;
  sand[from] = 0;

  return true;
}


function updateSand() {

  /*
    Process bottom-up.
  */

  for (
    let y = WORLD_HEIGHT - 2;
    y >= 0;
    y--
  ) {

    const leftFirst =
      Math.random() < 0.5;

    for (
      let x = 1;
      x < WORLD_WIDTH - 1;
      x++
    ) {

      if (!hasSand(x, y)) continue;

      /*
        Down.
      */

      if (
        moveSand(
          x, y,
          x, y + 1
        )
      ) {
        continue;
      }

      /*
        Diagonal sliding.
      */

      if (leftFirst) {

        if (
          moveSand(
            x, y,
            x - 1, y + 1
          )
        ) continue;

        if (
          moveSand(
            x, y,
            x + 1, y + 1
          )
        ) continue;

      } else {

        if (
          moveSand(
            x, y,
            x + 1, y + 1
          )
        ) continue;

        if (
          moveSand(
            x, y,
            x - 1, y + 1
          )
        ) continue;
      }
    }
  }
}


/* =========================================================
   INVENTORY
========================================================= */

/*
  Exactly ONE material type can be carried.

  Example:

      Sand × 12

  but never Sand + Stone simultaneously.
*/

const inventory = {
  type: null,
  amount: 0,
  capacity: 20
};

function updateInventoryUI() {

  const element =
    document.getElementById("inventory");

  if (!inventory.type) {

    element.textContent =
      "Inventory: Empty";

    return;
  }

  element.textContent =
    "Holding: " +
    inventory.type +
    " × " +
    inventory.amount +
    "/" +
    inventory.capacity;
}


/* =========================================================
   MINING
========================================================= */

let dirtConversion = 0;


/*
  Circular mining.

  Instead of:

      ███
      ███
      ███

  we effectively use:

        ██
      █████
      █████
        ██

  with the actual boundary determined mathematically.
*/

function mineCircular(centerX, centerY) {

  const radius = MINING_RADIUS;

  const minX =
    Math.floor(centerX - radius);

  const maxX =
    Math.ceil(centerX + radius);

  const minY =
    Math.floor(centerY - radius);

  const maxY =
    Math.ceil(centerY + radius);

  for (
    let y = minY;
    y <= maxY;
    y++
  ) {

    for (
      let x = minX;
      x <= maxX;
      x++
    ) {

      if (!insideWorld(x, y)) continue;

      /*
        Distance from the centre of the block
        to the mining centre.
      */

      const dx =
        (x + 0.5) -
        (centerX + 0.5);

      const dy =
        (y + 0.5) -
        (centerY + 0.5);

      if (
        dx * dx +
        dy * dy >
        radius * radius
      ) {
        continue;
      }

      mineBlock(x, y);
    }
  }

  /*
    Refresh grass around the excavated area.
  */

  refreshGrass(
    minX - 2,
    minY - 2,
    maxX + 2,
    maxY + 2
  );
}


function mineBlock(x, y) {

  const material =
    getTerrain(x, y);

  if (material === AIR) return;

  /*
    Mining is only possible if the block is exposed.
  */

  if (!isExposed(x, y)) return;

  /*
    Dirt → sand.
  */

  if (material === DIRT) {

    setTerrain(x, y, AIR);

    grass[index(x, y)] = 0;

    dirtConversion++;

    if (
      dirtConversion >=
      DIRT_TO_SAND
    ) {

      dirtConversion -=
        DIRT_TO_SAND;

      spawnSandNear(x, y);
    }

    return;
  }

  /*
    Stone can be mined but currently
    produces only visual dust.
  */

  if (material === STONE) {

    setTerrain(x, y, AIR);

    grass[index(x, y)] = 0;

    spawnStoneDust(x, y);
  }
}


/* =========================================================
   EXPOSURE
========================================================= */

function isExposed(x, y) {

  if (!insideWorld(x, y)) {
    return false;
  }

  return (
    getTerrain(x + 1, y) === AIR ||
    getTerrain(x - 1, y) === AIR ||
    getTerrain(x, y + 1) === AIR ||
    getTerrain(x, y - 1) === AIR ||

    hasSand(x + 1, y) ||
    hasSand(x - 1, y) ||
    hasSand(x, y + 1) ||
    hasSand(x, y - 1)
  );
}


/* =========================================================
   GRASS
========================================================= */

function refreshGrass(
  minX,
  minY,
  maxX,
  maxY
) {

  for (
    let x = Math.max(0, minX);
    x <= Math.min(WORLD_WIDTH - 1, maxX);
    x++
  ) {

    /*
      Find the highest solid block.
    */

    let foundSurface = false;

    for (
      let y = 0;
      y < WORLD_HEIGHT;
      y++
    ) {

      grass[index(x, y)] = 0;

      const material =
        getTerrain(x, y);

      if (
        !foundSurface &&
        material === DIRT &&
        getTerrain(x, y - 1) === AIR
      ) {

        grass[index(x, y)] = 1;

        foundSurface = true;
      }
    }
  }
}


/* =========================================================
   SAND SPAWNING
========================================================= */

function spawnSandNear(x, y) {

  /*
    Try the centre and nearby positions.
  */

  const positions = [
    [x, y],
    [x - 1, y],
    [x + 1, y],
    [x, y - 1],
    [x, y + 1]
  ];

  /*
    Shuffle slightly.
  */

  positions.sort(
    () => Math.random() - 0.5
  );

  for (const [px, py] of positions) {

    if (addSand(px, py)) {
      return;
    }
  }
}


/* =========================================================
   STONE DUST
========================================================= */

const stoneDust = [];

function spawnStoneDust(x, y) {

  for (let i = 0; i < 5; i++) {

    stoneDust.push({
      x:
        x * CELL +
        CELL / 2 +
        (Math.random() - .5) * 8,

      y:
        y * CELL +
        CELL / 2 +
        (Math.random() - .5) * 8,

      vx:
        (Math.random() - .5) * .8,

      vy:
        -Math.random() * .8,

      life: 20 + Math.random() * 15
    });
  }
}

function updateStoneDust() {

  for (
    let i = stoneDust.length - 1;
    i >= 0;
    i--
  ) {

    const p = stoneDust[i];

    p.x += p.vx;
    p.y += p.vy;

    p.vy += .04;

    p.life--;

    if (p.life <= 0) {

      stoneDust.splice(i, 1);
    }
  }
}


/* =========================================================
   COLLECT SAND
========================================================= */

function collectSand(x, y) {

  if (
    inventory.type &&
    inventory.type !== "sand"
  ) {
    return false;
  }

  if (
    inventory.amount >=
    inventory.capacity
  ) {
    return false;
  }

  if (!hasSand(x, y)) {
    return false;
  }

  removeSand(x, y);

  inventory.type = "sand";
  inventory.amount++;

  updateInventoryUI();

  return true;
}


/* =========================================================
   DROP SAND
========================================================= */

function dropSand(x, y) {

  if (
    inventory.type !== "sand" ||
    inventory.amount <= 0
  ) {
    return false;
  }

  /*
    Drop one grain.
  */

  for (let radius = 0; radius < 4; radius++) {

    for (
      let dy = -radius;
      dy <= radius;
      dy++
    ) {

      for (
        let dx = -radius;
        dx <= radius;
        dx++
      ) {

        if (
          dx * dx +
          dy * dy >
          radius * radius
        ) {
          continue;
        }

        if (
          addSand(
            x + dx,
            y + dy
          )
        ) {

          inventory.amount--;

          if (
            inventory.amount <= 0
          ) {

            inventory.type = null;
            inventory.amount = 0;
          }

          updateInventoryUI();

          return true;
        }
      }
    }
  }

  return false;
}


/* =========================================================
   CAMERA
========================================================= */

let cameraX = 0;
let cameraY = 0;
let zoom = 1;


function clampCamera() {

  const worldW =
    WORLD_WIDTH * CELL;

  const worldH =
    WORLD_HEIGHT * CELL;

  const visibleW =
    screenW / zoom;

  const visibleH =
    screenH / zoom;

  cameraX =
    Math.max(
      0,
      Math.min(
        cameraX,
        Math.max(0, worldW - visibleW)
      )
    );

  cameraY =
    Math.max(
      0,
      Math.min(
        cameraY,
        Math.max(0, worldH - visibleH)
      )
    );
}


/* =========================================================
   SCREEN → WORLD
========================================================= */

function screenToWorld(
  screenX,
  screenY
) {

  return {

    x: Math.floor(
      (cameraX +
       screenX / zoom) /
      CELL
    ),

    y: Math.floor(
      (cameraY +
       screenY / zoom) /
      CELL
    )
  };
}


/* =========================================================
   INPUT
========================================================= */

let pointerDown = false;
let dragging = false;

let lastPointerX = 0;
let lastPointerY = 0;

canvas.addEventListener(
  "pointerdown",
  e => {

    pointerDown = true;
    dragging = false;

    lastPointerX =
      e.clientX;

    lastPointerY =
      e.clientY;

    canvas.setPointerCapture(
      e.pointerId
    );
  }
);


canvas.addEventListener(
  "pointermove",
  e => {

    if (!pointerDown) return;

    const dx =
      e.clientX -
      lastPointerX;

    const dy =
      e.clientY -
      lastPointerY;

    if (
      Math.abs(dx) > 3 ||
      Math.abs(dy) > 3
    ) {

      dragging = true;
    }

    if (dragging) {

      cameraX -=
        dx / zoom;

      cameraY -=
        dy / zoom;

      clampCamera();
    }

    lastPointerX =
      e.clientX;

    lastPointerY =
      e.clientY;
  }
);


canvas.addEventListener(
  "pointerup",
  e => {

    if (!dragging) {

      handleTap(
        e.clientX,
        e.clientY
      );
    }

    pointerDown = false;
  }
);


/* =========================================================
   TAP
========================================================= */

function handleTap(
  screenX,
  screenY
) {

  const pos =
    screenToWorld(
      screenX,
      screenY
    );

  /*
    Sand collection takes priority.
  */

  if (
    collectSand(
      pos.x,
      pos.y
    )
  ) {
    return;
  }

  /*
    If carrying sand, tapping open
    ground drops a grain.
  */

  if (
    inventory.type === "sand"
  ) {

    if (
      dropSand(
        pos.x,
        pos.y
      )
    ) {
      return;
    }
  }

  /*
    Otherwise mine.
  */

  mineCircular(
    pos.x,
    pos.y
  );
}


/* =========================================================
   PINCH ZOOM
========================================================= */

let initialPinchDistance = null;
let initialZoom = 1;

canvas.addEventListener(
  "touchstart",
  e => {

    if (e.touches.length === 2) {

      initialPinchDistance =
        distance(
          e.touches[0],
          e.touches[1]
        );

      initialZoom = zoom;
    }
  },
  { passive: false }
);


canvas.addEventListener(
  "touchmove",
  e => {

    if (e.touches.length === 2) {

      e.preventDefault();

      const current =
        distance(
          e.touches[0],
          e.touches[1]
        );

      if (
        initialPinchDistance
      ) {

        zoom =
          initialZoom *
          (
            current /
            initialPinchDistance
          );

        zoom =
          Math.max(
            .7,
            Math.min(
              3,
              zoom
            )
          );

        clampCamera();
      }
    }
  },
  { passive: false }
);


function distance(a, b) {

  const dx =
    a.clientX -
    b.clientX;

  const dy =
    a.clientY -
    b.clientY;

  return Math.sqrt(
    dx * dx +
    dy * dy
  );
}


/* =========================================================
   RENDERING
========================================================= */

function render() {

  /*
    SKY
  */

  const sky =
    ctx.createLinearGradient(
      0,
      0,
      0,
      screenH
    );

  sky.addColorStop(
    0,
    "#68b9eb"
  );

  sky.addColorStop(
    1,
    "#a8dcf5"
  );

  ctx.fillStyle = sky;

  ctx.fillRect(
    0,
    0,
    screenW,
    screenH
  );


  ctx.save();

  ctx.scale(
    zoom,
    zoom
  );

  ctx.translate(
    -cameraX,
    -cameraY
  );


  const startX =
    Math.max(
      0,
      Math.floor(
        cameraX / CELL
      )
    );

  const startY =
    Math.max(
      0,
      Math.floor(
        cameraY / CELL
      )
    );

  const endX =
    Math.min(
      WORLD_WIDTH,
      Math.ceil(
        (
          cameraX +
          screenW / zoom
        ) / CELL
      )
    );

  const endY =
    Math.min(
      WORLD_HEIGHT,
      Math.ceil(
        (
          cameraY +
          screenH / zoom
        ) / CELL
      )
    );


  /* =====================================================
     TERRAIN
  ===================================================== */

  for (
    let y = startY;
    y < endY;
    y++
  ) {

    for (
      let x = startX;
      x < endX;
      x++
    ) {

      const material =
        getTerrain(x, y);

      if (
        material === AIR
      ) continue;


      /*
        Dirt
      */

      if (
        material === DIRT
      ) {

        ctx.fillStyle =
          "#9a6842";

        ctx.fillRect(
          x * CELL,
          y * CELL,
          CELL,
          CELL
        );


        /*
          Subtle dirt texture.

          Deterministic pattern based on
          coordinates so it doesn't flicker.
        */

        const seed =
          (
            x * 928371 +
            y * 523123
          ) & 255;

        if (
          seed % 7 === 0
        ) {

          ctx.fillStyle =
            "#8b5c39";

          ctx.fillRect(
            x * CELL + 3,
            y * CELL + 5,
            2,
            2
          );
        }

        if (
          seed % 13 === 0
        ) {

          ctx.fillStyle =
            "#ad784c";

          ctx.fillRect(
            x * CELL + 7,
            y * CELL + 3,
            2,
            2
          );
        }


        /*
          Grass only on exposed surface.
        */

        if (
          grass[index(x, y)]
        ) {

          ctx.fillStyle =
            "#5c9d3d";

          ctx.fillRect(
            x * CELL,
            y * CELL,
            CELL,
            3
          );

          /*
            Small variation in grass colour.
          */

          if (
            seed % 3 === 0
          ) {

            ctx.fillStyle =
              "#72b54a";

            ctx.fillRect(
              x * CELL + 2,
              y * CELL,
              2,
              2
            );
          }
        }
      }


      /*
        Stone
      */

      else if (
        material === STONE
      ) {

        ctx.fillStyle =
          "#686d72";

        ctx.fillRect(
          x * CELL,
          y * CELL,
          CELL,
          CELL
        );

        const seed =
          (
            x * 38171 +
            y * 71993
          ) & 255;

        if (
          seed % 5 === 0
        ) {

          ctx.fillStyle =
            "#5b6065";

          ctx.fillRect(
            x * CELL + 2,
            y * CELL + 3,
            3,
            2
          );
        }

        if (
          seed % 11 === 0
        ) {

          ctx.fillStyle =
            "#777c80";

          ctx.fillRect(
            x * CELL + 7,
            y * CELL + 8,
            2,
            2
          );
        }
      }


      /*
        Bedrock
      */

      else if (
        material === BEDROCK
      ) {

        ctx.fillStyle =
          "#292c30";

        ctx.fillRect(
          x * CELL,
          y * CELL,
          CELL,
          CELL
        );
      }
    }
  }


  /* =====================================================
     SAND GRAINS
  ===================================================== */

  /*
    IMPORTANT:

    Sand occupies a simulation cell, but is drawn
    as a tiny grain rather than filling the cell.
  */

  for (
    let y = startY;
    y < endY;
    y++
  ) {

    for (
      let x = startX;
      x < endX;
      x++
    ) {

      if (
        !hasSand(x, y)
      ) continue;

      /*
        Tiny round grain.
      */

      ctx.fillStyle =
        "#e5c15b";

      ctx.beginPath();

      ctx.arc(
        x * CELL + CELL / 2,
        y * CELL + CELL / 2,
        1.7,
        0,
        Math.PI * 2
      );

      ctx.fill();
    }
  }


  /* =====================================================
     STONE DUST
  ===================================================== */

  for (
    const p of stoneDust
  ) {

    ctx.fillStyle =
      `rgba(205,205,205,${p.life / 35})`;

    ctx.fillRect(
      p.x,
      p.y,
      2,
      2
    );
  }


  ctx.restore();
}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop() {

  /*
    Two simulation passes per frame gives the
    sand a little more responsiveness.
  */

  updateSand();
  updateSand();

  updateStoneDust();

  render();

  requestAnimationFrame(
    gameLoop
  );
}


/* =========================================================
