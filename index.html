<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Sandworks</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <canvas id="game"></canvas>

    <div id="hud">

        <div id="topbar">

            <div id="inventory">
                Inventory: Empty
            </div>

            <div id="version">
                v0.7.0
            </div>

        </div>


        <div id="hint">
            Hold and drag to mine
        </div>


        <div id="actions">

            <button
                class="action selected"
                data-mode="mine"
            >
                ⛏ Mine
            </button>

            <button
                class="action"
                data-mode="collect"
            >
                ✋ Collect
            </button>

            <button
                class="action"
                data-mode="drop"
            >
                🏖 Drop
            </button>

            <button
                class="action"
                data-mode="pan"
            >
                ✥ Move
            </button>

        </div>

    </div>


    <script
        type="module"
        src="js/main.js"
    ></script>

</body>
</html>
