<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Sandworks</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #78c8f5;
  font-family: system-ui, sans-serif;
  touch-action: none;
}

#game {
  display: block;
  width: 100vw;
  height: 100vh;
  image-rendering: pixelated;
}

#ui {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
}

.panel {
  background: rgba(20, 25, 30, 0.8);
  color: white;
  border: 2px solid rgba(255,255,255,.25);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 14px;
  pointer-events: auto;
}

#inventory {
  min-width: 110px;
}

#hint {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(20,25,30,.8);
  color: white;
  padding: 8px 12px;
  border-radius: 10px;
  font-size: 13px;
  text-align: center;
  pointer-events: none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
  <div class="panel">
    Sandworks
  </div>

  <div id="inventory" class="panel">
    Inventory: Empty
  </div>
</div>

<div id="hint">
  Tap exposed dirt to mine • Tap sand to collect • Tap elsewhere to drop
</div>

<script>
"use strict";

/* =========================================================
   CONFIG
========================================================= */

const CELL = 12;

const WORLD_WIDTH = 100;
const WORLD_HEIGHT = 160;

const GRAVITY_STEPS = 2;

const DIRT_TO_SAND = 2;


/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;

let screenW = 0;
let screenH = 0;

function resize() {
  screenW = canvas.width = window.innerWidth;
  screenH = canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();


/* =========================================================
   MATERIALS
========================================================= */

const AIR = 0;
const DIRT = 1;
const STONE = 2;
const BEDROCK = 3;

const SAND = 1;


/* =========================================================
   TERRAIN
========================================================= */

const terrain = new Uint8Array(
  WORLD_WIDTH * WORLD_HEIGHT
);

function index(x, y) {
  return y * WORLD_WIDTH + x;
}

function insideWorld(x, y) {
  return (
    x >= 0 &&
    x < WORLD_WIDTH &&
    y >= 0 &&
    y < WORLD_HEIGHT
  );
}

function getTerrain(x, y) {
  if (!insideWorld(x, y)) return BEDROCK;
  return terrain[index(x, y)];
}

function setTerrain(x, y, material) {
  if (!insideWorld(x, y)) return;
  terrain[index(x, y)] = material;
}


/* =========================================================
   GENERATE WORLD
========================================================= */

const surfaceY = 22;

for (let y = 0; y < WORLD_HEIGHT; y++) {

  for (let x = 0; x < WORLD_WIDTH; x++) {

    if (y < surfaceY) {
      setTerrain(x, y, AIR);
    }

    else if (y < surfaceY + 20) {
      setTerrain(x, y, DIRT);
    }

    else if (y < WORLD_HEIGHT - 5) {
      setTerrain(x, y, STONE);
    }

    else {
      setTerrain(x, y, BEDROCK);
    }
  }
}


/* =========================================================
   SAND PARTICLES
========================================================= */

const sand = new Uint8Array(
  WORLD_WIDTH * WORLD_HEIGHT
);

function hasSand(x, y) {
  if (!insideWorld(x, y)) return false;
  return sand[index(x, y)] !== 0;
}

function addSand(x, y) {
  if (!insideWorld(x, y)) return false;

  const i = index(x, y);

  if (terrain[i] !== AIR) return false;
  if (sand[i]) return false;

  sand[i] = SAND;
  return true;
}

function removeSand(x, y) {
  if (!insideWorld(x, y)) return false;

  const i = index(x, y);

  if (!sand[i]) return false;

  sand[i] = 0;
  return true;
}


/* =========================================================
   SAND PHYSICS
========================================================= */

function moveSand(x1, y1, x2, y2) {

  if (!insideWorld(x2, y2)) return false;

  const from = index(x1, y1);
  const to = index(x2, y2);

  if (!sand[from]) return false;

  if (terrain[to] !== AIR) return false;
  if (sand[to]) return false;

  sand[to] = sand[from];
  sand[from] = 0;

  return true;
}

function updateSand() {

  /*
    Bottom-to-top processing prevents a particle
    from being moved repeatedly during one pass.
  */

  for (let y = WORLD_HEIGHT - 2; y >= surfaceY; y--) {

    /*
      Randomize horizontal direction so piles
      don't always lean the same way.
    */

    const leftFirst = Math.random() < 0.5;

    for (let x = 1; x < WORLD_WIDTH - 1; x++) {

      if (!hasSand(x, y)) continue;

      // Straight down
      if (moveSand(x, y, x, y + 1)) {
        continue;
      }

      if (leftFirst) {

        if (moveSand(x, y, x - 1, y + 1)) {
          continue;
        }

        if (moveSand(x, y, x + 1, y + 1)) {
          continue;
        }

      } else {

        if (moveSand(x, y, x + 1, y + 1)) {
          continue;
        }

        if (moveSand(x, y, x - 1, y + 1)) {
          continue;
        }
      }
    }
  }
}


/* =========================================================
   INVENTORY
========================================================= */

/*
  IMPORTANT:
  The player can carry exactly ONE item.

  Later this can become:
  inventory = {
    type: "sand",
    amount: 10
  }

  But for now, one carried material stack is enough.
*/

const inventory = {
  type: null,
  amount: 0
};

function updateInventoryUI() {

  const element = document.getElementById("inventory");

  if (!inventory.type || inventory.amount <= 0) {
    element.textContent = "Inventory: Empty";
    return;
  }

  element.textContent =
    "Holding: " +
    inventory.type +
    " × " +
    inventory.amount;
}


/* =========================================================
   CAMERA
========================================================= */

let cameraX = 0;
let cameraY = 0;

let zoom = 1;

function clampCamera() {

  const worldPixelW = WORLD_WIDTH * CELL;
  const worldPixelH = WORLD_HEIGHT * CELL;

  const visibleW = screenW / zoom;
  const visibleH = screenH / zoom;

  cameraX = Math.max(
    0,
    Math.min(cameraX, worldPixelW - visibleW)
  );

  cameraY = Math.max(
    0,
    Math.min(cameraY, worldPixelH - visibleH)
  );
}


/* =========================================================
   WORLD ↔ SCREEN
========================================================= */

function screenToWorld(screenX, screenY) {

  const worldX =
    cameraX + screenX / zoom;

  const worldY =
    cameraY + screenY / zoom;

  return {
    x: Math.floor(worldX / CELL),
    y: Math.floor(worldY / CELL)
  };
}


/* =========================================================
   MINING
========================================================= */

function isExposed(x, y) {

  if (!insideWorld(x, y)) return false;

  /*
    A block is exposed if at least one
    neighboring cell is air.
  */

  return (
    getTerrain(x + 1, y) === AIR ||
    getTerrain(x - 1, y) === AIR ||
    getTerrain(x, y + 1) === AIR ||
    getTerrain(x, y - 1) === AIR
  );
}

function mine(x, y) {

  if (!insideWorld(x, y)) return;

  const material = getTerrain(x, y);

  if (!isExposed(x, y)) return;

  if (material === DIRT) {

    setTerrain(x, y, AIR);

    /*
      2 dirt blocks = 1 sand unit.

      We keep a fractional conversion counter
      so that individual blocks can be mined.
    */

    dirtConversion++;

    if (dirtConversion >= DIRT_TO_SAND) {

      dirtConversion -= DIRT_TO_SAND;

      spawnSandNear(x, y);
    }

    return;
  }

  /*
    Stone is mineable later, but we don't yet
    turn it into a useful material.
  */

  if (material === STONE) {

    setTerrain(x, y, AIR);

    spawnStoneDust(x, y);
  }
}

let dirtConversion = 0;


/* =========================================================
   SPAWN SAND
========================================================= */

function spawnSandNear(x, y) {

  const positions = [
    [x, y],
    [x - 1, y],
    [x + 1, y],
    [x, y - 1]
  ];

  for (const [px, py] of positions) {

    if (addSand(px, py)) return;
  }
}


/* =========================================================
   STONE DUST
========================================================= */

const stoneDust = [];

function spawnStoneDust(x, y) {

  for (let i = 0; i < 3; i++) {

    stoneDust.push({
      x: x * CELL + CELL / 2,
      y: y * CELL + CELL / 2,
      life: 20
    });
  }
}

function updateStoneDust() {

  for (let i = stoneDust.length - 1; i >= 0; i--) {

    const p = stoneDust[i];

    p.y += 0.4;
    p.life--;

    if (p.life <= 0) {
      stoneDust.splice(i, 1);
    }
  }
}


/* =========================================================
   COLLECT SAND
========================================================= */

function collectSand(x, y) {

  /*
    Inventory only accepts one type.

    This is deliberately restrictive.
  */

  if (
    inventory.type &&
    inventory.type !== "sand"
  ) {
    return false;
  }

  if (!hasSand(x, y)) {
    return false;
  }

  removeSand(x, y);

  inventory.type = "sand";
  inventory.amount++;

  updateInventoryUI();

  return true;
}


/* =========================================================
   DROP SAND
========================================================= */

function dropSand(x, y) {

  if (inventory.type !== "sand") {
    return false;
  }

  if (inventory.amount <= 0) {
    return false;
  }

  /*
    Find an available location near the tap.
  */

  for (let radius = 0; radius < 4; radius++) {

    for (
      let dy = -radius;
      dy <= radius;
      dy++
    ) {

      for (
        let dx = -radius;
        dx <= radius;
        dx++
      ) {

        const px = x + dx;
        const py = y + dy;

        if (addSand(px, py)) {

          inventory.amount--;

          if (inventory.amount <= 0) {
            inventory.type = null;
            inventory.amount = 0;
          }

          updateInventoryUI();

          return true;
        }
      }
    }
  }

  return false;
}


/* =========================================================
   TOUCH / MOUSE INPUT
========================================================= */

let pointerDown = false;

let lastPointerX = 0;
let lastPointerY = 0;

let dragging = false;

canvas.addEventListener(
  "pointerdown",
  e => {

    pointerDown = true;
    dragging = false;

    lastPointerX = e.clientX;
    lastPointerY = e.clientY;

    canvas.setPointerCapture(e.pointerId);
  }
);

canvas.addEventListener(
  "pointermove",
  e => {

    if (!pointerDown) return;

    const dx = e.clientX - lastPointerX;
    const dy = e.clientY - lastPointerY;

    if (
      Math.abs(dx) > 3 ||
      Math.abs(dy) > 3
    ) {
      dragging = true;
    }

    if (dragging) {

      cameraX -= dx / zoom;
      cameraY -= dy / zoom;

      clampCamera();
    }

    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
  }
);

canvas.addEventListener(
  "pointerup",
  e => {

    if (!dragging) {

      handleTap(
        e.clientX,
        e.clientY
      );
    }

    pointerDown = false;
  }
);


/* =========================================================
   TAP ACTION
========================================================= */

function handleTap(screenX, screenY) {

  const pos =
    screenToWorld(
      screenX,
      screenY
    );

  const x = pos.x;
  const y = pos.y;

  /*
    Priority 1:
    collect sand if tapped.
  */

  if (collectSand(x, y)) {
    return;
  }

  /*
    Priority 2:
    if carrying sand, drop it.
  */

  if (inventory.type === "sand") {

    if (dropSand(x, y)) {
      return;
    }
  }

  /*
    Priority 3:
    otherwise attempt mining.
  */

  mine(x, y);
}


/* =========================================================
   ZOOM
========================================================= */

let initialPinchDistance = null;
let initialZoom = 1;

canvas.addEventListener(
  "touchstart",
  e => {

    if (e.touches.length === 2) {

      initialPinchDistance =
        distance(
          e.touches[0],
          e.touches[1]
        );

      initialZoom = zoom;
    }
  },
  { passive: false }
);

canvas.addEventListener(
  "touchmove",
  e => {

    if (e.touches.length === 2) {

      e.preventDefault();

      const currentDistance =
        distance(
          e.touches[0],
          e.touches[1]
        );

      if (initialPinchDistance) {

        zoom =
          initialZoom *
          (currentDistance / initialPinchDistance);

        zoom =
          Math.max(
            0.7,
            Math.min(3, zoom)
          );

        clampCamera();
      }
    }
  },
  { passive: false }
);

function distance(a, b) {

  const dx = a.clientX - b.clientX;
  const dy = a.clientY - b.clientY;

  return Math.sqrt(
    dx * dx + dy * dy
  );
}


/* =========================================================
   RENDER
========================================================= */

function render() {

  ctx.fillStyle = "#78c8f5";

  ctx.fillRect(
    0,
    0,
    screenW,
    screenH
  );

  ctx.save();

  ctx.scale(zoom, zoom);

  ctx.translate(
    -cameraX,
    -cameraY
  );

  /*
    Visible world region
  */

  const startX =
    Math.floor(cameraX / CELL);

  const startY =
    Math.floor(cameraY / CELL);

  const endX =
    Math.ceil(
      (cameraX + screenW / zoom) / CELL
    );

  const endY =
    Math.ceil(
      (cameraY + screenH / zoom) / CELL
    );


  /* TERRAIN */

  for (
    let y = Math.max(0, startY);
    y < Math.min(WORLD_HEIGHT, endY);
    y++
  ) {

    for (
      let x = Math.max(0, startX);
      x < Math.min(WORLD_WIDTH, endX);
      x++
    ) {

      const material =
        getTerrain(x, y);

      if (material === AIR) continue;

      if (material === DIRT) {

        ctx.fillStyle = "#9b6b43";

      } else if (material === STONE) {

        ctx.fillStyle = "#666b72";

      } else if (material === BEDROCK) {

        ctx.fillStyle = "#25282c";
      }

      ctx.fillRect(
        x * CELL,
        y * CELL,
        CELL,
        CELL
      );
    }
  }


  /* SAND */

  ctx.fillStyle = "#e6c15a";

  for (
    let y = Math.max(surfaceY, startY);
    y < Math.min(WORLD_HEIGHT, endY);
    y++
  ) {

    for (
      let x = Math.max(0, startX);
      x < Math.min(WORLD_WIDTH, endX);
      x++
    ) {

      if (!hasSand(x, y)) continue;

      ctx.fillRect(
        x * CELL + 2,
        y * CELL + 2,
        CELL - 3,
        CELL - 3
      );
    }
  }


  /* STONE DUST */

  for (const p of stoneDust) {

    ctx.fillStyle =
      `rgba(180,180,180,${p.life / 20})`;

    ctx.fillRect(
      p.x,
      p.y,
      3,
      3
    );
  }


  /* SURFACE LINE */

  ctx.fillStyle = "#5aa33b";

  ctx.fillRect(
    0,
    surfaceY * CELL - 3,
    WORLD_WIDTH * CELL,
    3
  );


  ctx.restore();
}


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime = 0;

function gameLoop(time) {

  const delta =
    time - lastTime;

  lastTime = time;

  /*
    Keep simulation stable regardless
    of phone frame rate.
  */

  updateSand();
  updateSand();

  updateStoneDust();

  render();

  requestAnimationFrame(gameLoop);
}


/* =========================================================
   START
========================================================= */

updateInventoryUI();

requestAnimationFrame(gameLoop);

</script>

</body>
</html>
