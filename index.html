<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Sand Factory — Mobile Prototype</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <header>
    <h1>Sand Factory — Prototype</h1>
    <div id="topbar" class="panel">
      <div class="row"><div class="stat">Held Sand:</div><div id="sandCount" class="big">0</div></div>
    </div>
  </header>

  <div id="gameWrap">
    <div id="game" class="panel">
      <canvas id="c"></canvas>
      <div id="hud">
        <button id="collectBtn" class="btn toggle">Collect</button>
        <button id="dropBtn" class="btn toggle">Drop</button>
        <button id="reset" class="btn">Reset</button>
      </div>
    </div>
  </div>

  <footer class="panel">
    <div class="stat">Drag on ground to mine sand. Tap/drag while in Drop mode to place sand. Drag canvas to pan.</div>
    <div class="controls">
      
    </div>
  </footer>
</div>

<script src="js/app.js" defer></script>
</body>
</html>
